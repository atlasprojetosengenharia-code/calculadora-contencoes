# Publica uma nova versão SOMENTE quando você envia uma tag de versão
# (ex.: git tag v0.3.0 && git push origin v0.3.0). Envios comuns para a
# main NÃO publicam nada — eles só rodam os testes (veja testes.yml).
#
# A tag precisa ser igual a "v" + version do Cargo.toml; se não for, nada
# é publicado. A release pública recebe a tag vX.Y.Z-build.N (formato que
# o verificador de atualizações do programa entende).
#
# Distribuição pública sem expor o código:
#   - o código fica neste repositório PRIVADO;
#   - a release (somente o .zip) é publicada no repositório PÚBLICO
#     definido em REPO_PUBLICO, usando o segredo RELEASES_TOKEN
#     (token fine-grained com "Contents: read and write" só naquele repositório).
#   - sem o segredo, o .zip fica como artefato da execução (aba Actions).
name: Compilar e publicar

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REPO_PUBLICO: atlasprojetosengenharia-code/calculadora-contencoes-releases
  TEM_TOKEN_PUBLICO: ${{ secrets.RELEASES_TOKEN != '' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Conferir tag x versão do Cargo.toml
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_name }}" -ne "v$v") {
            Write-Error "A tag ${{ github.ref_name }} não corresponde à versão do Cargo.toml (v$v). Nada foi publicado."
            exit 1
          }

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de compilação
        uses: Swatinem/rust-cache@v2

      - name: Testes
        run: cargo test

      - name: Compilar (release)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: cargo build --release

      - name: Empacotar
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$v-build.${{ github.run_number }}"
          $nome = "CalculadoraContencoes_v$v-build.${{ github.run_number }}"
          $pasta = "dist/$nome"
          New-Item -ItemType Directory -Force "$pasta/exemplos" | Out-Null
          Copy-Item target/release/calculadora_contencoes.exe "$pasta/CalculadoraContencoes.exe"
          Copy-Item exemplos/* "$pasta/exemplos/"
          Copy-Item LEIA-ME.txt "$pasta/"
          Compress-Archive -Path $pasta -DestinationPath "dist/$nome.zip"
          "TAG=$tag" >> $env:GITHUB_ENV
          "VERSAO=$v" >> $env:GITHUB_ENV
          "ZIP=dist/$nome.zip" >> $env:GITHUB_ENV

      - name: Publicar release no repositório público
        if: env.TEM_TOKEN_PUBLICO == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.REPO_PUBLICO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ env.TAG }}
          target_commitish: main
          name: Calculadora de Contenções ${{ env.VERSAO }} (build ${{ github.run_number }})
          body: |
            Baixe o arquivo **.zip** abaixo, descompacte e execute `CalculadoraContencoes.exe` (Windows 10/11, 64 bits). Não requer instalação.
          files: ${{ env.ZIP }}

      - name: Guardar executável como artefato (sem token público configurado)
        if: env.TEM_TOKEN_PUBLICO != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: ${{ env.ZIP }}
          retention-days: 30
