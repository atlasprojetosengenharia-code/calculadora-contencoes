[package]
name = "calculadora_contencoes"
version = "0.3.3"
edition = "2024"
description = "Software de análise e dimensionamento de contenções (NBR 11682, 6122, 5629, 16920, 6118)"
authors = ["Atlas Projetos e Engenharia LTDA"]
license-file = "LICENSE"
publish = false

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
